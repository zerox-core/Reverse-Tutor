# 教学评测 rubric：游戏宅学生的「最佳实践区间」（标准区间打分，拍板机制）
# 流程：学生主动问「该怎么练/怎么吃/怎么睡」或 D7 验收 → 收集老师给出的计划 → LLM 按本 rubric 结构化评分（json mode）→ 分数+各维度点评进会话。
# 依据来源均为本包 sources/ 第一批资料（台账见 sources/README.md）。数值为内容层草案，可随实测迭代。

version: 1
student_profile: 典型游戏宅（久坐 6h+ / 凌晨睡 / 外卖快乐水 / 零运动基线）
total_score: 100
scoring:
  per_dimension: 20
  bands:
    best: 16-20        # 落在最佳区间
    acceptable: 8-15   # 落在可接受区间
    redline: 0-7       # 触碰红线
  missing_dimension: 按缺失扣分并点名（计划没覆盖该维度 = 不完整，鼓励老师补全）
grades:
  excellent: 85-100    # 游戏宅健康导师
  good: 70-84          # 合格，个别维度待补
  pass: 60-69          # 及格线，有明显短板
  fail: 0-59           # 计划需要重做

dimensions:
  - id: sleep
    name: 睡眠
    weight: 20
    best: 23:00 前入睡、时长 7-8 小时、节律相对固定；含熬夜后的止损安排（补觉/热水澡/清淡早餐）
    acceptable: 0:00 前入睡、≥6.5 小时；偶尔熬夜但有止损意识
    redline: 长期凌晨 2 点后睡且不足 6 小时；建议长期自行服用褪黑素或安眠药助眠
    source: [src-07 上海卫健委, src-09 人民日报]
  - id: diet
    name: 饮食
    weight: 20
    best: 对照八准则给出可执行点法：食物多样有蔬果蛋白搭配、少盐少油控糖（含糖饮料有替代方案）、规律进餐足量饮水、熬夜夜宵有清淡方案
    acceptable: 大方向对但笼统（如「吃健康点」「少吃外卖」），缺具体落地动作
    redline: 默认三餐高油高盐外卖 + 含糖饮料当水喝 + 深夜暴食；或极端节食断食
    source: [src-06 膳食指南八准则, src-04 体重管理]
  - id: exercise
    name: 运动
    weight: 20
    best: 每周 3-5 次中等强度有氧（每次 30 分钟起，微微气喘可交谈）+ 每周 2-3 次力量；循序渐进、含恢复安排（符合超量恢复逻辑）
    acceptable: 有运动安排但频率/强度不足，或只有有氧没有力量
    redline: 周末突击一次高强度（平时零运动）；带伤硬练；计划无恢复概念
    source: [src-01 体育总局, src-10 凯圣王概念层, src-03 上班族微运动]
  - id: sedentary_breaks
    name: 久坐中断
    weight: 20
    best: 每 30-60 分钟起身活动 10-15 分钟，且给出具体动作（踝泵/颈部拉伸/毛巾拉伸等）
    acceptable: 有「每小时起来动动」的意识但无具体动作和时长
    redline: 连续 3 小时以上久坐不动的计划（如「一口气打到通关再说」）
    source: [src-01 体育总局, src-08 EDG队医]
  - id: scenario_fit
    name: 场景针对性
    weight: 20
    best: 计划贴着游戏宅现实写：碎片时间可执行、居家零器械起步、与游戏作息兼容、起步门槛低到不可能失败
    acceptable: 方向对但泛化（「多运动」「早点睡」），与学生作息有明显摩擦
    redline: 健身房年卡式计划/需整块时间/高器械门槛；与学生实际作息硬冲突（如要求 5 点晨跑）
    source: [学生人设卡 student-card.yaml, src-02 五大误区]

notes:
  - 评分输出形态：总分 + 每维度得分/落档/一句点评 + 最低分维度的改进建议；进会话由角色卡按表达契约渲染。
  - 允许老师修订计划后复评（建议至多 1 次），复评记录同样进 mastery 账本。
  - 本 rubric 只对「计划质量」打分；知识掌握度仍走源码 mastery 闸门，两者不互相替代。
